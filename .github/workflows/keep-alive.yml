name: Keep Render Awake

on:
  schedule:
    # GitHub no ejecuta cron más rápido que cada 5 min (y a veces se retrasa)
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Traketeros (con reintentos por si está arrancando)
        run: |
          curl -sf --retry 5 --retry-delay 20 --retry-all-errors --max-time 60 \
            https://traketeros.onrender.com/health \
            || echo "Fallo el ping, pero seguimos"
