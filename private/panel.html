<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ff2596">
  <title>Panel · Traketeros</title>
  <script src="/tema.js?v=1" data-boton="no"></script>
  <link rel="icon" href="/assets/traketeros.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;700;800;900&display=swap">
  <style>
    :root {
      --red: #ff2596;
      --dark-red: #c2007a;
      --cream: #fff3fa;
      --cyan: #00a8e6;
      --black: #1a0018;
      --white: #fff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      background: var(--cream);
      color: var(--black);
      font-family: Inter, Arial, sans-serif;
      overflow: hidden;
    }
    :focus-visible { outline: 4px solid var(--black); outline-offset: 2px; }

    /* ---------- Cabecera ---------- */
    .top {
      flex: none;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      background: var(--red);
      color: var(--white);
      border-bottom: 5px solid var(--black);
    }
    .top img { width: 44px; height: 44px; border-radius: 10px; }
    .top .titulo { display: flex; flex-direction: column; line-height: 1.05; min-width: 0; }
    .top .titulo strong { font-family: Bangers, Inter, sans-serif; font-size: 26px; letter-spacing: 1px; font-weight: 400; }
    .top .titulo small { font-weight: 800; font-size: 11px; letter-spacing: 1.5px; opacity: .9; }
    .top .acciones { margin-left: auto; display: flex; gap: 8px; }

    .btn {
      font: inherit;
      font-weight: 800;
      font-size: 13px;
      padding: 8px 12px;
      color: var(--black);
      background: var(--white);
      border: 3px solid var(--black);
      border-radius: 10px;
      box-shadow: 3px 3px 0 var(--black);
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--black); }

    /* ---------- Pestañas ---------- */
    .tabs {
      flex: none;
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      overflow-x: auto;
      background: var(--cream);
      border-bottom: 3px solid var(--black);
      scrollbar-width: thin;
    }
    .tab {
      flex: none;
      font: inherit;
      font-weight: 800;
      font-size: 14px;
      padding: 9px 14px;
      color: var(--black);
      background: var(--white);
      border: 3px solid var(--black);
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab:hover { background: #ffe0f1; }
    .tab[aria-selected="true"] {
      background: var(--cyan);
      color: var(--white);
      box-shadow: 3px 3px 0 var(--black);
    }

    /* ---------- Zona de contenido ---------- */
    .stage { position: relative; flex: 1; min-height: 0; background: var(--white); }
    .stage iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--cream);
      display: none;
    }
    .stage iframe.activo { display: block; }


    /* ---------- Modo noche (lo activa /tema.js) ---------- */
    html[data-tema="noche"] { color-scheme: dark; --cream: #150014; --black: #ecdcf2; }
    html[data-tema="noche"] .btn,
    html[data-tema="noche"] .tab { background: #241024; }
    html[data-tema="noche"] .tab:hover { background: #43153a; }
    html[data-tema="noche"] .tab[aria-selected="true"] { background: var(--cyan); color: #1a0018; }
    html[data-tema="noche"] .stage { background: #150014; }

    @media (max-width: 560px) {
      .top { padding: 8px 10px; }
      .top .titulo strong { font-size: 22px; }
      .btn .txt { display: none; }
    }
  </style>
</head>
<body>

<header class="top">
  <img src="/assets/traketeros.png" alt="" width="44" height="44">
  <div class="titulo">
    <strong>TRAKETEROS</strong>
    <small>PANEL DE CONTROL</small>
  </div>
  <div class="acciones">
    <button class="btn" id="tema" type="button" title="Cambiar tema">🌗<span class="txt"> Tema</span></button>
    <button class="btn" id="recargar" type="button" title="Recargar esta sección">↻<span class="txt"> Recargar</span></button>
    <button class="btn" id="aparte" type="button" title="Abrir esta sección en otra pestaña">↗<span class="txt"> Abrir aparte</span></button>
  </div>
</header>

<nav class="tabs" id="tabs" role="tablist" aria-label="Secciones de administración"></nav>

<main class="stage" id="stage"></main>

<script>
  // Todas las subwebs de admin en un solo sitio. Para añadir una nueva, una línea más aquí.
  const SECCIONES = [
    { id: 'suscripciones', icono: '💳', nombre: 'Suscripciones', url: '/admin.html' },
    { id: 'cuota',         icono: '💶', nombre: 'Cuota',         url: '/admin-cuota.html' },
    { id: 'tkt365',        icono: '🎰', nombre: 'TKT365',        url: '/admin-tkt365.html' },
    { id: 'estatutos',     icono: '📜', nombre: 'Estatutos',     url: '/admin-estatutos.html' },
    { id: 'fotos',         icono: '📸', nombre: 'Fotos',         url: '/fotos.html?admin=1' },
    { id: 'traketimetro',  icono: '🍻', nombre: 'Traketímetro',  url: '/traketimetro.html?admin=1' }
  ];

  const $tabs = document.getElementById('tabs');
  const $stage = document.getElementById('stage');
  const tabs = {};     // id → botón
  const frames = {};   // id → iframe (se crean la primera vez que entras y se conservan)
  let actual = null;

  // Las páginas son del mismo sitio, así que podemos quitarles su cabecera
  // (el menú de arriba ya hace de navegación) y que no te saquen del panel.
  function limpiarCabecera(frame) {
    try {
      const doc = frame.contentDocument;
      if (!doc || !doc.head) return;
      const st = doc.createElement('style');
      st.textContent = '.site-header{display:none!important}';
      doc.head.appendChild(st);
    } catch (_) { /* si no se puede, se queda como está */ }
  }

  function abrir(id, { guardar = true } = {}) {
    const sec = SECCIONES.find((s) => s.id === id) || SECCIONES[0];
    actual = sec;

    for (const s of SECCIONES) {
      tabs[s.id].setAttribute('aria-selected', String(s.id === sec.id));
      if (frames[s.id]) frames[s.id].classList.toggle('activo', s.id === sec.id);
    }

    if (!frames[sec.id]) {
      const f = document.createElement('iframe');
      f.title = sec.nombre;
      f.addEventListener('load', () => limpiarCabecera(f));
      f.src = sec.url;
      f.classList.add('activo');
      $stage.appendChild(f);
      frames[sec.id] = f;
    }

    tabs[sec.id].scrollIntoView({ block: 'nearest', inline: 'center' });
    if (guardar) history.replaceState(null, '', '#' + sec.id);
  }

  for (const s of SECCIONES) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab';
    b.setAttribute('role', 'tab');
    b.textContent = s.icono + ' ' + s.nombre;
    b.addEventListener('click', () => abrir(s.id));
    $tabs.appendChild(b);
    tabs[s.id] = b;
  }

  document.getElementById('recargar').addEventListener('click', () => {
    const f = actual && frames[actual.id];
    if (!f) return;
    try { f.contentWindow.location.reload(); } catch (_) { f.src = actual.url; }
  });

  document.getElementById('aparte').addEventListener('click', () => {
    if (actual) window.open(actual.url, '_blank', 'noopener');
  });


  // ---------- Tema día / noche ----------
  const $tema = document.getElementById('tema');
  const ICONOS_TEMA = { auto: '🌗', noche: '🌙', dia: '☀️' };
  const NOMBRES_TEMA = { auto: 'Auto', noche: 'Noche', dia: 'Día' };
  function pintarTema(e) {
    $tema.firstChild.textContent = ICONOS_TEMA[e.modo];
    $tema.querySelector('.txt').textContent = ' ' + NOMBRES_TEMA[e.modo];
    $tema.title = 'Tema: ' + NOMBRES_TEMA[e.modo].toLowerCase() + (e.modo === 'auto' ? ' (ahora de ' + (e.noche ? 'noche' : 'día') + ')' : '') + ' · pulsa para cambiar';
  }
  if (window.temaTraketeros) {
    pintarTema(window.temaTraketeros.estado());
    window.addEventListener('tema-cambio', (ev) => pintarTema(ev.detail));
    $tema.addEventListener('click', () => window.temaTraketeros.ciclar());
  } else {
    $tema.hidden = true;
  }

  window.addEventListener('hashchange', () => abrir(location.hash.slice(1), { guardar: false }));

  abrir(location.hash.slice(1), { guardar: false });
</script>
</body>
</html>
