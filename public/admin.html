<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ff2596">
  <title>Traketeros · Admin</title>
  <link rel="icon" href="assets/traketeros.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="styles.css?v=23">
  <link rel="stylesheet" href="noche.css?v=5">
  <script src="tema.js?v=2"></script>
</head>
<body>

<header class="site-header">
  <a class="brand" href="/" aria-label="Traketeros">
    <img src="assets/traketeros.png" width="64" height="64" alt="Logo Traketeros">
  </a>
  <div class="header-copy">
    <strong>TRAKETEROS</strong>
    <small>PANEL DE ADMIN</small>
  </div>
  <a class="header-link" href="/">Ver la web</a>
</header>

<main>
  <nav class="admin-tabs" aria-label="Secciones de administración" role="tablist">
    <button class="admin-tab active" type="button" role="tab" aria-selected="true" data-tab="tkt365">TKT365</button>
    <button class="admin-tab" type="button" role="tab" aria-selected="false" data-tab="estatutos">Estatutos</button>
    <button class="admin-tab" type="button" role="tab" aria-selected="false" data-tab="comunidad">Calendario y avisos</button>
  </nav>

  <section class="admin-tab-panel active" id="tab-tkt365" data-panel="tkt365">
    <iframe class="admin-embed" title="Administración de TKT365" data-src="admin-tkt365.html" loading="lazy"></iframe>
  </section>
  <section class="admin-tab-panel" id="tab-estatutos" data-panel="estatutos" hidden>
    <iframe class="admin-embed" title="Administración de estatutos" data-src="admin-estatutos.html" loading="lazy"></iframe>
  </section>
  <section class="admin-tab-panel" id="tab-comunidad" data-panel="comunidad" hidden>
    <iframe class="admin-embed" title="Calendario y avisos" data-src="admin-comunidad.html" loading="lazy"></iframe>
  </section>
</main>

<style>
  .admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px;padding:8px;background:var(--panel,#171717);border:1px solid var(--line,#333);border-radius:14px}
  .admin-tab{border:1px solid transparent;border-radius:9px;padding:11px 16px;background:transparent;color:inherit;font:inherit;font-weight:800;cursor:pointer}
  .admin-tab.active{background:#ff2596;color:#fff}
  .admin-tab-panel[hidden]{display:none!important}
  .admin-embed{display:block;width:100%;height:calc(100vh - 210px);min-height:720px;border:0;border-radius:12px;background:transparent}
  @media(max-width:650px){.admin-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.admin-tab{padding:10px 7px}.admin-embed{height:calc(100vh - 230px);min-height:760px}}
</style>
<script src="admin-panel.js?v=1"></script>
</body>
</html>
