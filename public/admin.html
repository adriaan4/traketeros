<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e3262e">
  <title>Traketeros · Admin</title>
  <link rel="icon" href="assets/traketeros.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>

<header class="site-header">
  <a class="brand" href="/" aria-label="Traketeros">
    <img src="assets/traketeros.png" width="64" height="64" alt="Logo Traketeros">
  </a>
  <div class="header-copy">
    <strong>TRAKETEROS</strong>
    <small>PANEL DE ADMIN</small>
  </div>
  <a class="header-link" href="/">Ver la web</a>
</header>

<main>
  <div class="admin-head">
    <div>
      <div class="eyebrow">PANEL DE CONTROL</div>
      <h1>Suscripciones</h1>
    </div>
    <button class="mini" id="refresh" type="button">Actualizar</button>
  </div>

  <div class="stats">
    <div class="stat"><small>CLIENTES</small><b id="stat-customers">—</b></div>
    <div class="stat"><small>ACTIVOS</small><b id="stat-active">—</b></div>
    <div class="stat"><small>COBRADO</small><b id="stat-revenue">—</b></div>
    <div class="stat"><small>PAGOS</small><b id="stat-payments">—</b></div>
  </div>

  <section class="panel">
    <div class="panel-head">
      <h2>Miembros</h2>
      <input class="search" id="q" type="search" placeholder="Buscar…">
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>Cliente</th><th>Estado</th><th>Cuota</th><th>Próximo cobro</th><th></th></tr></thead>
        <tbody id="members"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <h2>Facturas</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>Factura</th><th>Email</th><th>Estado</th><th>Importe</th><th>Fecha</th></tr></thead>
        <tbody id="invoices"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="admin.js?v=4"></script>
</body>
</html>
