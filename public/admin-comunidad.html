<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff2596"><title>Traketeros · Admin comunidad</title><link rel="icon" href="assets/traketeros.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;700;800;900&display=swap"><link rel="stylesheet" href="styles.css?v=21"><link rel="stylesheet" href="noche.css?v=3"><link rel="stylesheet" href="community.css?v=3"><script src="tema.js?v=2"></script></head><body><header class="site-header"><a class="brand" href="dashboard.html"><img src="assets/traketeros.png" width="64" height="64" alt="Logo Traketeros"></a><div class="header-copy"><strong>TRAKETEROS</strong><small>ADMIN · COMUNIDAD</small></div><nav class="nav-links"><a class="header-link" href="admin-tkt365.html">Admin TKT365</a><a class="header-link" href="calendario.html">Ver calendario</a></nav></header><main class="community-main"><section class="community-hero"><div class="community-kicker">PANEL DE DIRECTIVA</div><h1>Gestionar comunidad.</h1><p>Publica eventos y avisos. Esta sección usa la autenticación de administrador del servidor.</p></section><section class="community-grid"><article class="community-card"><h2>➕ Nuevo evento</h2><form class="community-form" id="eventForm"><label>Nombre<input name="name" maxlength="100" required placeholder="Quedada, cena, fiesta…"></label><label>Fecha<input name="date" type="date" required></label><label>Hora<input name="time" type="time"></label><label>Lugar<input name="place" maxlength="120" placeholder="Dónde quedamos"></label><label class="span2">Descripción<textarea name="description" maxlength="500"></textarea></label><div class="span2"><button class="community-button primary" type="submit">Publicar evento</button></div></form><p class="community-message" id="eventMsg"></p><h3>Eventos publicados</h3><ul class="com
